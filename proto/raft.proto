syntax = "proto3"

package raft;

service RaftService {
  rpc RequestVote (VoteArgs) returns (VoteReply);

  rpc AppendEntries (AppendArgs) returns (AppendReply);

  rpc ClientWrite (PutRequest) returns (PutReply);
}

message VoteArgs {
  uint64 term = 1;          // candidate's term
  uint32 candidate_id = 2;  // candidate requesting vote
  uint64 last_log_index = 3;// index of candidate's last log entry
  uint64 last_log_term = 4; // term candidate's last log entry
}

message VoteReply {
  uint64 term = 1;          // current term, for candidate to update itself
  bool vote_granted = 2;    // true - candidate received vote
}

message AppendArgs {
  uint64 term = 1;                // leader's term
  uint32 leader_id = 2;           // so follower can redirect clients
  uint64 prev_log_index = 3;      // index of log entry immediately preceding new ones
  uint64 prev_log_term = 4;       // term of prevLogIndex entry
  repeated LogEntry entries = 5;  // log entries to store (empty for heartbeat; may send more than one for efficiency)
  uint64 leader_commit = 6;       // leader's commitIndex
}

message AppendReply {
  uint64 term = 1;      // current term, for leader to update itself
  bool success = 2;     // true if follower contained entry matching prev_log_index and prev_log_term
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  string key = 3;
  string value = 4;
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutReply {
  bool success = 1;
  uint32 leader_id = 2;     // if false, tells the client who the real leader is
}
