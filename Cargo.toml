[package]
name = "OxideKV"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.14.9"
prost = "0.14.4"
tonic-prost = "0.14.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
stateright = "0.30.1"

[lib]
name = "oxidekv"
path = "src/lib.rs"

[[bin]]
name = "checker"
path = "src/bin/checker.rs"

[build-dependencies]
tonic-prost-build = "0.14.9"
